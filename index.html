let userScore = 0;
let answeredCount = 0;

function renderQuiz() {
    const container = document.getElementById('quizContainer');
    let html = '';

    quizData.forEach((item, index) => {
        html += `
            <div class="quiz-card" id="card-${index}">
                <div class="question">${item.q}</div>
                <div class="options" id="options-${index}">
                    ${item.options.map((opt, optIdx) => `
                        <button class="option-btn" onclick="checkAnswer(${index}, ${optIdx})">${opt}</button>
                    `).join('')}
                </div>
                <div class="explanation" id="explain-${index}">
                    <strong>เฉลย:</strong> ${item.options[item.answer]}<br>
                    <strong>คำอธิบาย:</strong> ${item.explain}
                </div>
            </div>
        `;
    });

    container.innerHTML = html;
}

function checkAnswer(qIndex, selectedOpt) {
    const card = document.getElementById(`card-${qIndex}`);
    const optionBtns = card.querySelectorAll('.option-btn');
    const explainBox = document.getElementById(`explain-${qIndex}`);
    const correctAnswer = quizData[qIndex].answer;

    optionBtns.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === correctAnswer) {
            btn.classList.add('correct');
        }
    });

    if (selectedOpt === correctAnswer) {
        userScore++;
    } else {
        optionBtns[selectedOpt].classList.add('incorrect');
    }

    explainBox.style.display = 'block';

    answeredCount++;
    document.getElementById('scoreBoard').innerText = `คะแนนของคุณ: ${userScore} / 100 (ทำไปแล้ว ${answeredCount} ข้อ)`;
}

window.onload = renderQuiz;
</script>
